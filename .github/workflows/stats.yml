name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: update-readme-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # GitHub Stats
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=dark&show_icons=true&include_all_commits=true&count_private=true&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      # Top Languages
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=4&card_width=420&hide_border=true&bg_color=0B0F14&title_color=88C0D0&text_color=D8DEE9
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      # Streak Stats
      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=dark&card_width=420&card_height=170&hide_border=true&background=0B0F14&ring=88C0D0&fire=88C0D0&currStreakLabel=88C0D0&sideLabels=D8DEE9&dates=616E88&currStreakNum=ECEFF4&sideNums=ECEFF4
          path: profile/streak.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      # Pin Card
      - name: Generate pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=stats-organization&repo=github-readme-stats
          path: profile/pin-stats-organization-github-readme-stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      # Commit generated cards
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update README cards"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
